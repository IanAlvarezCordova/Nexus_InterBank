server.port=8082
spring.application.name=ms-transacciones

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres-db-nexus}:5432/db_nexus_transacciones
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

api.cuentas.url=${URL_MS_CUENTAS:http://nexus-ms-cuentas:8083}
api.geo.url=${URL_MS_GEOGRAFIA:http://nexus-ms-geografia:8081}
api.clientes.url=${URL_MS_CLIENTES:http://nexus-ms-clientes:8084}

api.switch.url=${APP_SWITCH_URL:http://host.docker.internal:9081}
api.switch.network.url=${APP_SWITCH_NETWORK_URL:http://host.docker.internal:9082}
banco.codigo=${BANCO_CODIGO:NEXUS_BANK}
api.key=${API_KEY:NEXUS_SECRET_KEY_123}